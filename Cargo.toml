[package]
name = "vga-emu"
version = "0.8.5"
edition = "2024"
authors = ["Michael Bohn <spaceodyssey@gmx.de>"]
description = "VGA Emulator"
license = "GPL-3.0"
repository = "https://github.com/Ragnaroek/vga-emu"

[lib]
name = "vga"
crate-type = ["cdylib", "rlib"]

[features]
egui = [
    "dep:eframe",
    "dep:egui",
    "dep:tokio",
    "dep:winit",
]
sdl3 = [
    "dep:sdl3",
    "dep:tokio",
]
sdl2 = [
    "dep:sdl2",
    "dep:tokio"
]
web = [
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "dep:js-sys",
]
all = ["egui", "sdl2", "sdl3", "web"]

[dev-dependencies]
tokio = { version = "1.51.1", features = ["full"] }

[dependencies]
# feature "egui"
eframe = { version = "0.37.0", optional = true }
egui = { version = "0.37.0", optional = true }
winit = { version = "0.30.13", optional = true }

# feature "sdl3"
sdl3 = { version = "0.22.0", optional = true, features = ["unsafe_textures"] }
tokio = { version = "1.51.1", optional = true, features = ["time", "rt"] }

#feature "sdl2"
sdl2 = { version = "0.38.0", optional = true, default-features = false, features = ["unsafe_textures"]}

# feature "web"
wasm-bindgen = { version = "0.2.130", optional = true }
wasm-bindgen-futures = { version = "0.4.80", optional = true }
js-sys = { version = "0.3.107", optional = true }
web-sys = { version = "0.3.107", optional = true, features = [
    'Document',
    'Window',
    'CanvasRenderingContext2d',
    'HtmlCanvasElement',
    'ImageData',
    'KeyboardEvent',
    'console',
] }
